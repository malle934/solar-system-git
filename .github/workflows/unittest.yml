name: Solar System Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
      - 'feature-branch'

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  Unit_testing:
      name: Unit_testing
      strategy:
        matrix:
          nodejs_version: [18,19,20]
          operating_system: [ubuntu-latest, macos-latest]
          exclude:
              - nodejs_version: 18
                operating_system: macos-latest

      runs-on: ${{ matrix.operating_system }}  

      steps:
        - name: checkout Repo
          uses: actions/checkout@v4

        - name: setup nodejs_version ${{ matrix.nodejs_version }}
          uses: actions/setup-node@v3
          with:
            node-version: ${{ matrix.nodejs_version }}

        - name: adding cache
          uses: actions/cache@v3
          with:
            path: node_modules
            key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json')}}    

        - name: install dependencies
          run: npm install

        - name: test npm
          run: npm test

        - name: upload the test results
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-test-result        
            path: test-results.xml

  code-coverage:
    name: code coverage
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node 18
        uses: actions/setup-node@v3
        with:
          node-version: 18
  
      - name: adding cache
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json')}}     

      - name: install dependencies
        run: npm install

      - name: code coverage
        continue-on-error: true
        run: npm run coverage  

      - name: archive test result
        uses: actions/upload-artifact@v4
        with:
          name: Code-Coverage-Result
          path: coverage
          retention-days: 5      

  docker:
    name: containerization
    needs: [Unit_testing,code-Coverage]
    runs-on: ubuntu-latest

    steps:
      - name: login
        uses: actions/checkout@v4

      - name: login into docker
        uses: docker/login-action@v2.2.0
        with:
          username: ${{ vars.name }}
          password: ${{ secrets.password }}   

      - name: build and test
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: ${{ vars.name }}/solar-System:${{ github.sha }}     

      - name: docker image Unit_testing
        run: |
          docker images 
          docker run solar-System \
          -p 3000:3000 \
          -e MONGO_URI=$MONGO_URI \
          -e MONGO_USERNAME=$MONGO_USERNAME \
          -e MONGO_PASSWORD=$MONGO_PASSWORD \                        
          ${{ vars.name  }}/solar-System:${{ github.sha }}


          # Display container IP address
          echo "Container IP:" $(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)

          # Test the /live endpoint
          echo "Testing /live endpoint"
          wget -q -O - http://127.0.0.1:3000/live | grep live