name: Solar System Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
      - 'feature-branch'
               
jobs:
    Unit_testing:
        name: unit testing
        runs-on: ubuntu-latest
        
        steps:
            - name: checkout Repo
              uses: actions/checkout@v4

            - name: setup nodejs-18
              uses: actions/setup-node@v3
              with:
                node-version: 18

            - name: install dependencies
              run: npm install
            
            - name: unit test
              run: npm test

            
            
